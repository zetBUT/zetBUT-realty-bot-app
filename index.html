<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c2733; color: white; padding: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; background: #2c3b4a; color: white; }
        button { width: 100%; padding: 15px; background: #248bcf; color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <h2>📊 Параметри оцінки</h2>
    <label>Місто/Село:</label>
    <input type="text" id="city" placeholder="Напр: Житомир">
    
    <label>Тип об'єкта:</label>
    <select id="type">
        <option value="квартира">Квартира</option>
        <option value="будинок">Будинок</option>
    </select>

    <label>Ціна за м² ($):</label>
    <input type="number" id="price" placeholder="700">

    <button onclick="send()">ШУКАТИ</button>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        function send() {
            let data = {
                city: document.getElementById("city").value,
                type: document.getElementById("type").value,
                price: document.getElementById("price").value
            };
            tg.sendData(JSON.stringify(data)); // Відправляє дані боту
        }
    </script>
</body>
</html>ы
