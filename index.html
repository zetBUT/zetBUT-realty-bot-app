<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оцінка нерухомості Житомир</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; color: #333; }
        .container { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #0088cc; }
        label { display: block; margin: 10px 0 5px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #0088cc; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0077b5; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Оцінка майна</h2>
        
        <label>Об'єкт:</label>
        <select id="type">
            <option value="prodazha-kvartir">🏢 Квартира</option>
            <option value="prodazha-domov">🏡 Будинок / Дача</option>
        </select>

        <label>Населений пункт (Житомирська обл.):</label>
        <input type="text" id="town" placeholder="Наприклад: Березівка" required>

        <label>Ціна за м² ВІД (грн):</label>
        <input type="number" id="min_p" placeholder="0">

        <label>Ціна за м² ДО (грн):</label>
        <input type="number" id="max_p" placeholder="50000">

        <button onclick="search()">🔍 Знайти схожі об'єкти</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Розгортає вікно на весь екран

        function search() {
            const type = document.getElementById('type').value;
            const town = document.getElementById('town').value;
            const min = document.getElementById('min_p').value;
            const max = document.getElementById('max_p').value;

            if (!town) { alert("Введіть населений пункт!"); return; }

            const query = encodeURIComponent(`${town} житомирська область`);
            
            // Формуємо посилання на OLX з жорсткими фільтрами за м2
            const url = `https://www.olx.ua/uk/nedvizhimost/${type}/zhitomirskaya-oblast/q-${query}/?search%5Bfilter_float_price_per_m2%3Afrom%5D=${min}&search%5Bfilter_float_price_per_m2%3Ato%5D=${max}`;

            // Відкриваємо посилання прямо в зовнішньому браузері
            tg.openLink(url);
        }
    </script>
</body>
</html>
