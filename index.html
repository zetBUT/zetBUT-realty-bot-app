<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Оцінка 2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; padding: 15px; }
        .box { background: #2d2d2d; padding: 20px; border-radius: 15px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #0088cc; color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 18px; margin-top: 10px; }
        label { font-size: 14px; color: #aaa; }
    </style>
</head>
<body>
    <div class="box">
        <h2 style="text-align:center">📊 Оцінка майна</h2>
        
        <label>Тип об'єкта:</label>
        <select id="type">
            <option value="prodazha-kvartir">🏢 Квартира</option>
            <option value="prodazha-domov">🏡 Будинок</option>
        </select>

        <label>Населений пункт (Житомирська обл.):</label>
        <input type="text" id="town" placeholder="Наприклад: Житомир" required>

        <label>Кількість кімнат:</label>
        <input type="number" id="rooms" placeholder="Наприклад: 2">

        <label>Поверх:</label>
        <input type="number" id="floor" placeholder="Наприклад: 5">

        <div style="display:flex; gap:10px">
            <div style="width:50%"><label>Ціна м² ВІД:</label><input type="number" id="min_p" placeholder="0"></div>
            <div style="width:50%"><label>Ціна м² ДО:</label><input type="number" id="max_p" placeholder="100000"></div>
        </div>

        <button onclick="search()">🚀 ЗНАЙТИ АНАЛОГИ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function search() {
            const town = document.getElementById('town').value;
            const type = document.getElementById('type').value;
            const rooms = document.getElementById('rooms').value;
            const floor = document.getElementById('floor').value;
            const min = document.getElementById('min_p').value;
            const max = document.getElementById('max_p').value;

            if(!town) return alert("Введіть місто!");

            const q = encodeURIComponent(`${town} житомирська область`);
            
            // Формуємо лінк з усіма параметрами (поверх, кімнати, ціна м2)
            let url = `https://www.olx.ua/uk/nedvizhimost/${type}/zhitomirskaya-oblast/q-${q}/?search%5Bfilter_float_price_per_m2%3Afrom%5D=${min}&search%5Bfilter_float_price_per_m2%3Ato%5D=${max}`;
            
            if(rooms) url += `&search%5Bfilter_enum_number_of_rooms%5D%5B0%5D=${rooms}`;
            if(floor) url += `&search%5Bfilter_float_floor%3Afrom%5D=${floor}&search%5Bfilter_float_floor%3Ato%5D=${floor}`;

            tg.openLink(url);
        }
    </script>
</body>
</html>
