<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Пошук нерухомості Житомирщина</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #eef2f3; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #7f8c8d; font-size: 14px; }
        select, input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #dcdde1; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 15px; background: #00a8ff; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; transition: background 0.3s; }
        button:hover { background: #0097e6; }
    </style>
</head>
<body>

<div class="card">
    <h2>🏠 Пошук Житла</h2>
    
    <label>Що шукаємо?</label>
    <select id="realty_type">
        <option value="prodazha-kvartir">🏢 Квартира</option>
        <option value="prodazha-domov">🏡 Будинок</option>
        <option value="prodazha-domov">⛺ Дача</option>
    </select>

    <label>Населений пункт (Житомирська обл.):</label>
    <input type="text" id="location" placeholder="Наприклад: Коростишів" required>

    <label>Ціна за м² ВІД (грн):</label>
    <input type="number" id="min_price" value="0">

    <label>Ціна за м² ДО (грн):</label>
    <input type="number" id="max_price" value="100000">

    <button onclick="startSearch()">🔍 Знайти точно</button>
</div>

<script>
function startSearch() {
    const type = document.getElementById('realty_type').value;
    const loc = document.getElementById('location').value;
    const min = document.getElementById('min_price').value;
    const max = document.getElementById('max_price').value;

    if(!loc) { alert("Введіть місто або село!"); return; }

    // Формуємо пошуковий запит
    let query = loc + " житомирська область";
    const encodedQuery = encodeURIComponent(query);

    // Створюємо пряме посилання на OLX з фільтрами ціни за кв.м.
    const url = `https://www.olx.ua/uk/nedvizhimost/${type}/zhitomirskaya-oblast/q-${encodedQuery}/?search%5Bfilter_float_price_per_m2%3Afrom%5D=${min}&search%5Bfilter_float_price_per_m2%3Ato%5D=${max}`;

    // Відкриваємо в новій вкладці
    window.open(url, '_blank');
}
</script>

</body>
</html>
