<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #1c1c1c; color: white; padding: 20px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #333; background: #2b2b2b; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #0088cc; border: none; border-radius: 10px; color: white; font-weight: bold; font-size: 16px; margin-top: 10px; }
    </style>
</head>
<body>
    <h3>🏠 Пошук нерухомості</h3>
    
    <div class="input-group">
        <label>Що шукаємо?</label>
        <select id="obj_type">
            <option value="квартира">🏢 Квартира</option>
            <option value="будинок">🏡 Будинок</option>
            <option value="дача">⛺ Дача</option>
        </select>
    </div>

    <div class="input-group">
        <label>Назва (місто/село/селище):</label>
        <input type="text" id="loc" placeholder="Напр: Глибочиця або Коростишів">
    </div>

    <div class="input-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
            <label>Кімнат:</label>
            <input type="number" id="rooms" placeholder="2">
        </div>
        <div style="flex: 1;">
            <label>Поверх:</label>
            <input type="number" id="floor" placeholder="5">
        </div>
    </div>

    <div class="input-group">
        <label>Ціна за м² ВІД (грн):</label>
        <input type="number" id="min_p" placeholder="0">
    </div>

    <div class="input-group">
        <label>Ціна за м² ДО (грн):</label>
        <input type="number" id="max_p" placeholder="50000">
    </div>

    <button onclick="sendDataToBot()">🔍 ЗНАЙТИ ОБ'ЄКТИ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendDataToBot() {
            const data = {
                type: document.getElementById('obj_type').value,
                loc: document.getElementById('loc').value,
                rooms: document.getElementById('rooms').value,
                floor: document.getElementById('floor').value,
                min: document.getElementById('min_p').value,
                max: document.getElementById('max_p').value
            };

            if (!data.loc) {
                alert("Введіть назву населеного пункту!");
                return;
            }

            // Це відправляє дані в Python-файл
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
