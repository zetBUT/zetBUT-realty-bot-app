<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function sendDataToBot() {
        const data = {
            type: document.getElementById('obj_type').value,
            loc: document.getElementById('loc').value,
            rooms: document.getElementById('rooms').value,
            floor: document.getElementById('floor').value,
            min: document.getElementById('min_p').value,
            max: document.getElementById('max_p').value
        };

        if (!data.loc) {
            alert("Введіть назву населеного пункту!");
            return;
        }

        // КЛЮЧОВИЙ МОМЕНТ:
        try {
            tg.sendData(JSON.stringify(data)); 
            // Після цього Mini App має закритися сам, а бот — отримати дані
        } catch (e) {
            alert("Помилка відправки! Переконайтеся, що ви відкрили це через Telegram.");
        }
    }
</script>
